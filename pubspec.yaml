name: habit_tracker
description: "Glow, a habit tracker with streaks, a daily planner and reminders."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.10
  uuid: ^4.5.3
  shared_preferences: ^2.1.3
  sqflite: ^2.2.8+4
  flutter_local_notifications: ^14.0.0
  flutter_native_timezone: ^2.0.0
  timezone: ^0.9.0
  intl: ^0.18.1
  path: ^1.8.4
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
